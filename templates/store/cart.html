<!doctype html><html><head><meta charset='utf-8'><title>Cart</title></head><body style='font-family:Arial;max-width:800px;margin:40px auto'><h1>Your Cart</h1>{% if error %}<p style='color:red'>{{ error }}</p>{% endif %}{% for item in items %}<div><strong>{{ item.product.name }}</strong> × {{ item.quantity }} — ₹{{ item.subtotal }} <a href='{% url "remove_from_cart" item.id %}'>Remove</a></div>{% empty %}<p>Your cart is empty.</p>{% endfor %}<h2>Total: ₹{{ total }}</h2>{% if items %}<a href='{% url "checkout" %}'>Place order</a>{% endif %}<p><a href='{% url "product_list" %}'>Continue shopping</a></p></body></html>
