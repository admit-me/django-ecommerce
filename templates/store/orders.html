<!doctype html><html><head><meta charset='utf-8'><title>Orders</title></head><body style='font-family:Arial;max-width:800px;margin:40px auto'><h1>Order History</h1>{% for order in orders %}<article style='border:1px solid #ddd;padding:15px;margin:12px 0'><h2>Order #{{ order.id }}</h2><p>Status: {{ order.status }} | Total: ₹{{ order.total }}</p>{% for item in order.items.all %}<p>{{ item.product.name }} × {{ item.quantity }} — ₹{{ item.subtotal }}</p>{% endfor %}</article>{% empty %}<p>No orders yet.</p>{% endfor %}<a href='{% url "product_list" %}'>Shop</a></body></html>
