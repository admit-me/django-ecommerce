<!doctype html><html><head><meta charset='utf-8'><title>{{ product.name }}</title></head><body style='font-family:Arial;max-width:800px;margin:40px auto'><p><a href='{% url "product_list" %}'>← Shop</a></p><h1>{{ product.name }}</h1><p>{{ product.description }}</p><h2>₹{{ product.price }}</h2><p>Available: {{ product.stock }}</p>{% if product.stock %}<form method='post' action='{% url "add_to_cart" product.id %}'>{% csrf_token %}<input type='number' name='quantity' value='1' min='1' max='{{ product.stock }}'><button>Add to cart</button></form>{% else %}<p>Out of stock</p>{% endif %}</body></html>
