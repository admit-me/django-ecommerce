<!doctype html><html><head><meta charset='utf-8'><title>Shop</title><style>body{font-family:Arial;max-width:1000px;margin:30px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{border:1px solid #ddd;border-radius:10px;padding:18px}a{color:#1769aa;text-decoration:none}button{padding:8px 14px}</style></head><body><h1>PythonShop</h1><form><input name='q' placeholder='Search products'><button>Search</button></form><p><a href='{% url "cart" %}'>Cart</a> | <a href='{% url "orders" %}'>Orders</a></p><div class='grid'>{% for product in products %}<div class='card'><h2><a href='{% url "product_detail" product.slug %}'>{{ product.name }}</a></h2><p>{{ product.description|truncatewords:20 }}</p><strong>₹{{ product.price }}</strong><p>Stock: {{ product.stock }}</p></div>{% empty %}<p>No products found. Add products from Django admin.</p>{% endfor %}</div></body></html>
